<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Online Shop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 960px;
            margin: 0 auto;
            padding: 24px;
            color: #222;
        }

        nav {
            display: flex;
            gap: 20px;
            margin-bottom: 28px;
        }

        nav a {
            color: #1459a6;
            text-decoration: none;
        }

        #product-grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit, minmax(190px, 1fr)
            );
            gap: 16px;
        }

        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
        }

        button {
            padding: 9px 12px;
            border: 0;
            border-radius: 5px;
            background: #1459a6;
            color: white;
            cursor: pointer;
        }

        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        #error-message {
            margin-top: 16px;
            padding: 10px;
            border-radius: 6px;
        }

        #error-message:empty {
            display: none;
        }

        #error-message.error {
            color: #9d2525;
            background: #f8e6e6;
        }

        #error-message.success {
            color: #176b35;
            background: #e4f5e9;
        }
    </style>

    <!-- Load app.js as a JavaScript module -->
    <script type="module" src="./app.js"></script>
</head>

<body>
    <!-- Main navigation -->
    <nav aria-label="Main navigation">
        <a href="#home">Home</a>
        <a href="#shop">Shop</a>
        <a href="#cart">
            Cart (<span id="cart-count">0</span>)
        </a>
    </nav>

    <main id="home">
        <h1>Welcome to My Shop</h1>

        <section id="shop" aria-labelledby="shop-heading">
            <h2 id="shop-heading">Products</h2>

            <!-- JavaScript displays product cards here -->
            <div id="product-grid"></div>

            <!-- Displays accessible error or feedback messages -->
            <p id="error-message" aria-live="polite"></p>
        </section>
    </main>
</body>
</html>
